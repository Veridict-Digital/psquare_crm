# Nginx configuration for PSquare CRM
server {
    # Allow large file uploads (increase as needed)
    client_max_body_size 20M;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # Static files
    location /static/ {
        alias /home/ubuntu/psquare_crm/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/psquare_crm/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Frontend (React app - serve static files)
    location / {
        root /home/ubuntu/psquare_crm/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/psquare_crm/backend/psquare_crm.sock;
    }

    # Admin panel
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/psquare_crm/backend/psquare_crm.sock;
    }
}
