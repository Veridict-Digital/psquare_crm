services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file: .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - backend

volumes:
  media_files:
  static_files:
