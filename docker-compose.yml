services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file: .env
    networks:
      - coolify
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    restart: unless-stopped
    volumes:
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - backend
    networks:
      - coolify
      - internal

networks:
  coolify:
    external: true
  internal:
    driver: bridge

volumes:
  media_files:
  static_files:
